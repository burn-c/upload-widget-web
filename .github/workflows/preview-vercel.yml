name: Deploy to Vercel PREVIEW

on:
  # Permite que você rode esta pipeline manualmente na aba Actions
  workflow_dispatch:
  
  # Se quiser manter os gatilhos automáticos (ex: push na main), basta deixá-los aqui:
  # push:
  #   branches: [ main ]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VITE_DEPLOY_PROVIDER: Vercel Preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Configure node
        id: configure-node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        id: install-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install vercel
        id: install-vercel
        run: |
          npm install --global vercel@latest

      - name: Pull vercel config
        id: pull-vercel-config
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build app
        id: build-app
        run: |
          vercel build --token="$VERCEL_TOKEN"

      - name: Deploy app
        id: deploy-app
        run: |
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"